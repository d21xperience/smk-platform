name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd services/edge-bff && go mod download
          cd apps/siakad-guru && yarn install
      
      - name: Lint Backend
        run: |
          cd services/edge-bff
          go vet ./...
      
      - name: Lint Frontend
        run: |
          cd apps/siakad-guru
          yarn lint
      
      - name: Test Backend
        run: |
          cd services/edge-bff
          go test ./...
      
      - name: Build Frontend
        run: |
          cd apps/siakad-guru
          yarn build