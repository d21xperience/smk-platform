syntax = "proto3";

package assessment.v1;

option go_package = "sekolah-platform/services/tu-core/proto/assessment/v1;assessmentv1";

import "google/protobuf/timestamp.proto";

service AssessmentService {
  rpc CreateAssessment(CreateAssessmentRequest) returns (CreateAssessmentResponse);
  rpc UpdateAssessment(UpdateAssessmentRequest) returns (UpdateAssessmentResponse);
  rpc GetAssessment(GetAssessmentRequest) returns (GetAssessmentResponse);
  rpc GetStudentAssessments(GetStudentAssessmentsRequest) returns (GetStudentAssessmentsResponse);
  rpc GetSubjectAssessments(GetSubjectAssessmentsRequest) returns (GetSubjectAssessmentsResponse);
  rpc ListAssessments(ListAssessmentsRequest) returns (ListAssessmentsResponse);
  rpc GetStudentAverage(GetStudentAverageRequest) returns (GetStudentAverageResponse);
}

message CreateAssessmentRequest {
  string student_id = 1;
  string subject_id = 2;
  string assessment_type = 3; // DAILY, MIDTERM, FINAL
  double score = 4;
  double max_score = 5;
  google.protobuf.Timestamp assessment_date = 6;
  int32 semester = 7; // 1 atau 2
  string notes = 8;
}

message CreateAssessmentResponse {
  Assessment assessment = 1;
}

message UpdateAssessmentRequest {
  string assessment_id = 1;
  double score = 2;
  double max_score = 3;
  string notes = 4;
}

message UpdateAssessmentResponse {
  Assessment assessment = 1;
}

message GetAssessmentRequest {
  string assessment_id = 1;
}

message GetAssessmentResponse {
  Assessment assessment = 1;
}

message GetStudentAssessmentsRequest {
  string student_id = 1;
  int32 semester = 2;
  string subject_id = 3;
}

message GetStudentAssessmentsResponse {
  repeated Assessment assessments = 1;
  repeated SubjectAverage averages = 2;
}

message GetSubjectAssessmentsRequest {
  string subject_id = 1;
  string class_id = 2;
  int32 semester = 3;
}

message GetSubjectAssessmentsResponse {
  repeated Assessment assessments = 1;
}

message ListAssessmentsRequest {
  string student_id = 1;
  string subject_id = 2;
  string assessment_type = 3;
  int32 semester = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message ListAssessmentsResponse {
  repeated Assessment assessments = 1;
  int32 total = 2;
}

message GetStudentAverageRequest {
  string student_id = 1;
  int32 semester = 2;
}

message GetStudentAverageResponse {
  repeated SubjectAverage averages = 1;
  double overall_average = 2;
}

message Assessment {
  string id = 1;
  string school_id = 2;
  string academic_period_id = 3;
  string student_id = 4;
  string student_name = 5;
  string subject_id = 6;
  string subject_name = 7;
  string assessment_type = 8;
  double score = 9;
  double max_score = 10;
  double percentage = 11;
  google.protobuf.Timestamp assessment_date = 12;
  int32 semester = 13;
  string notes = 14;
  string created_by = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message SubjectAverage {
  string subject_id = 1;
  string subject_name = 2;
  double average = 3;
  int32 total_assessments = 4;
  string grade = 5; // A, B, C, D, E
}
