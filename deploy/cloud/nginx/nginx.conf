worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

    Upstream definitions
    upstream Edge_bff {
        server Edge-bff:8080;
    }

    Website Sekolah
    server {
        listen 80;
        server_name sekolah.smk.sch.id;

        root /usr/share/nginx/html/web;
        index index.html;

        Static files with long cache
        location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            limit_req zone=static burst=20 nodelay;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        SPA fallback
        location / {
            limit_req zone=static burst=10 nodelay;
            try_files $uri $uri/ /index.html;
        }
    }

    SIAKAD Guru
    server {
        listen 80;
        server_name guru.smk.sch.id;

        root /usr/share/nginx/html/guru;
        index index.html;

        location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            limit_req zone=static burst=20 nodelay;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            limit_req zone=static burst=10 nodelay;
            try_files $uri $uri/ /index.html;
        }
    }
    PPDB
    server {
        listen 80;
        server_name ppdb.smk.sch.id;

        root /usr/share/nginx/html/ppdb;
        index index.html;

        location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            limit_req zone=static burst=20 nodelay;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            limit_req zone=static burst=10 nodelay;
            try_files $uri $uri/ /index.html;
        }
    }
    API Gateway (Edge BFF)
    server {
        listen 80;
        server_name api.smk.sch.id;

        Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://Edge_bff;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        Health check endpoint
        location /health {
            proxy_pass http://Edge_bff/health;
            access_log off;
        }
    }
}
