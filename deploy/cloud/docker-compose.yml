services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend-web:/usr/share/nginx/html/web:ro
      - frontend-guru:/usr/share/nginx/html/guru:ro
      - frontend-ppdb:/usr/share/nginx/html/ppdb:ro
    depends_on:
      - Edge-bff
    restart: unless-stopped
    networks:
      - frontend

  Edge-bff:
    image: ghcr.io/smk-platform/Edge-bff:latest
    environment:
      - GIN_MODE=release
      - SQLITE_PATH=/data/Edge.db
      - REDIS_URL=redis://redis:6379
      - GRPC_CORE_ACADEMIC=Core-academic:50051
      - GRPC_CORE_STUDENT=Core-student:50052
      - GRPC_CORE_ATTENDANCE=Core-attendance:50053
      - GRPC_CORE_ASSESSMENT=Core-assessment:50054
    volumes:
      - Edge-data:/data
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - frontend
      - Backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - Backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - Backend
volumes:
  Edge-data:
  redis-data:
  frontend-web:
  frontend-guru:
  frontend-ppdb:
networks:
  frontend:
    driver: bridge
  Backend:
    driver: bridge
