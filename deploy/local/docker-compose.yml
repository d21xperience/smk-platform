services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smk_platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backup:/backup
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible from localhost
    restart: unless-stopped
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    networks:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  Core-academic:
    image: ghcr.io/smk-platform/Core-academic:latest
    environment:
      - POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/smk_platform?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - GRPC_PORT=50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:50051:50051"
    restart: unless-stopped
    networks:
      - Backend
      - database
      - cache

  Core-student:
    image: ghcr.io/smk-platform/Core-student:latest
    environment:
      - POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/smk_platform?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - GRPC_PORT=50052
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:50052:50052"
    restart: unless-stopped
    networks:
      - Backend
      - database
      - cache

  Core-attendance:
    image: ghcr.io/smk-platform/Core-attendance:latest
    environment:
      - POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/smk_platform?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - GRPC_PORT=50053
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:50053:50053"
    restart: unless-stopped
    networks:
      - Backend
      - database
      - cache

  Core-assessment:
    image: ghcr.io/smk-platform/Core-assessment:latest
    environment:
      - POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/smk_platform?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - GRPC_PORT=50054
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:50054:50054"
    restart: unless-stopped
    networks:
      - Backend
      - database
      - cache

  Core-reporting:
    image: ghcr.io/smk-platform/Core-reporting:latest
    environment:
      - POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/smk_platform?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - GRPC_PORT=50055
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:50055:50055"
    restart: unless-stopped
    networks:
      - Backend
      - database
      - cache
      - storage

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  Backend:
    driver: bridge
  database:
    driver: bridge
  cache:
    driver: bridge
  storage:
    driver: bridge
